name: Build slim Godot Web template (Island Fight Race)

on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: "Godot git tag (must match your editor)"
        default: "4.7.2-stable"
      emscripten:
        description: "Emscripten SDK version your old template used"
        default: "4.0.11"
      baseline_wasm_bytes:
        description: "Size of your current godot.wasm"
        default: "19287799"
      optimize:
        description: "size (-Os) or size_extra (-Oz, smallest)"
        type: choice
        options: [size, size_extra]
        default: size
      keep_mbedtls:
        description: "Keep mbedTLS (true if you did NOT apply patches/0001 to the game)"
        type: boolean
        default: false

defaults:
  run:
    shell: bash          # bash -eo pipefail: a failing scons can no longer be hidden by tee

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }

      - name: Checkout Godot
        run: git clone --depth 1 --branch "${{ inputs.godot_ref }}" https://github.com/godotengine/godot.git godot

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emscripten }}
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install scons

      - name: Apply build profile
        run: |
          mkdir -p godot/profiles
          cp kit/profiles/island_fight_race.build godot/profiles/
          python3 -c "import json;d=json.load(open('godot/profiles/island_fight_race.build'));print('profile ok,',len(d['disabled_classes']),'classes')"

      - name: Show which options this Godot version knows (informational)
        working-directory: godot
        run: |
          scons platform=web --help > ../scons_help.txt 2>&1 || true
          for o in threads dlink_enabled javascript_eval optimize lto production deprecated minizip brotli graphite accesskit disable_xr disable_navigation_2d disable_navigation_3d disable_physics_2d openxr vulkan d3d12 metal use_volk build_profile; do
            grep -q -- "$o" ../scons_help.txt && echo "known:   $o" || echo "UNKNOWN: $o (will be ignored)"
          done

      - name: Build template_release (web, no threads)
        working-directory: godot
        run: |
          set -euxo pipefail
          MODS=""
          for m in csg gridmap enet webrtc upnp multiplayer camera mobile_vr openxr webxr theora basis_universal gltf fbx noise jsonrpc tga bmp dds ktx hdr tinyexr msdfgen godot_physics_2d godot_physics_3d navigation_2d navigation_3d mono interactive_music minimp3 raycast vhacd squish; do
            MODS="$MODS module_${m}_enabled=no"
          done
          if [ "${{ inputs.keep_mbedtls }}" != "true" ]; then MODS="$MODS module_mbedtls_enabled=no"; fi
          scons -j"$(nproc)" \
            platform=web target=template_release threads=no dlink_enabled=no javascript_eval=yes build_name=custom_build \
            optimize=${{ inputs.optimize }} lto=full production=yes debug_symbols=no deprecated=no \
            opengl3=yes vulkan=no d3d12=no metal=no openxr=no use_volk=no \
            minizip=no brotli=no graphite=no accesskit=no \
            disable_xr=yes disable_navigation_2d=yes disable_navigation_3d=yes disable_physics_2d=yes \
            build_profile=profiles/island_fight_race.build \
            $MODS 2>&1 | tee ../build.log
          ls -l bin
          test -f bin/godot.web.template_release.wasm32.nothreads.zip

      - name: Package and report sizes
        run: |
          mkdir -p out && cp godot/bin/godot.web.template_release.wasm32.nothreads.zip out/web_nothreads_release.zip
          cd out && mkdir t && unzip -q web_nothreads_release.zip -d t
          W=$(stat -c%s t/godot.wasm); B=${{ inputs.baseline_wasm_bytes }}
          echo "godot.wasm: $W bytes (old $B, saved $((B-W)) = $(( (B-W)*100/B ))%)" | tee sizes.txt
          echo "gzip -9: $(gzip -9 -c t/godot.wasm | wc -c)" | tee -a sizes.txt
          if [ "$W" -ge "$B" ]; then echo "::error::New wasm is NOT smaller than old. Re-run with optimize=size_extra."; exit 1; fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: web_nothreads_release
          path: out/web_nothreads_release.zip

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            scons_help.txt
            out/sizes.txt
          if-no-files-found: ignore
